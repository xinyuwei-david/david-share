name: Azure Agent Sandbox Hosting CI

on:
  push:
    paths:
      - "Agents/Azure-Agent-Sandbox-Hosting/**"
      - ".github/workflows/agent-sandbox-hosting-ci.yml"
  pull_request:
    paths:
      - "Agents/Azure-Agent-Sandbox-Hosting/**"
      - ".github/workflows/agent-sandbox-hosting-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  offline-checks:
    name: Offline checks (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: Agents/Azure-Agent-Sandbox-Hosting
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: Agents/Azure-Agent-Sandbox-Hosting
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Rebuild measurements from the run records
        run: python tools/build_measurements.py --check
      - name: Re-render the four pages
        run: python tools/render_docs.py --check
      - name: Check figures and icons against the ledger
        run: python tools/build_diagrams.py --check
      - name: Validate the pages and publication scope
        run: python tools/validate_docs.py
      - name: Offline tests
        run: python -m pytest -q
