name: docs-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Rebuild measurements from the run records
        run: python tools/build_measurements.py --check
      - name: Re-render the four pages
        run: python tools/render_docs.py --check
      - name: Check figures and icons against the ledger
        run: python tools/build_diagrams.py --check
      - name: Validate the pages
        run: python tools/validate_docs.py
      - name: Offline tests
        run: python -m pytest -q
